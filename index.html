<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nu-Insight | School Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
/* nu insight - black & white, one family (Archivo) used at two widths */
:root{
  --bg:#fff; --fg:#000; --mute:#767676; --line:#d9d9d9; --soft:#f1f1f1;
  --pad:clamp(16px,3.2vw,44px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --fg:#fff; --mute:#8c8c8c; --line:#2a2a2a; --soft:#141414;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);
  font:400 15px/1.5 "Archivo",system-ui,sans-serif;
  font-stretch:100%;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;
  display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:var(--pad);
  padding:14px var(--pad);background:var(--bg);border-bottom:1px solid var(--line);
}
.logo svg{width:54px;height:54px;display:block}
.tabs{display:flex;gap:22px}
.tabs a{color:var(--mute);padding:4px 0;border-bottom:2px solid transparent}
.tabs a.on{color:var(--fg);border-color:var(--fg)}
.search input{
  width:100%;max-width:420px;justify-self:end;margin-left:auto;display:block;
  font:inherit;color:inherit;background:var(--soft);border:0;border-radius:99px;padding:10px 18px;
}
.search input::placeholder{color:var(--mute)}
.ghost{border:1px solid var(--line);border-radius:99px;padding:8px 16px}
.ghost:hover{border-color:var(--fg)}

/* ---------- shared ---------- */
main{padding:0 var(--pad) 80px;min-height:70vh;outline:0}
.sec{margin-top:clamp(40px,7vw,88px)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
h1,h2{font-stretch:125%;font-weight:800;letter-spacing:-.04em;line-height:.95;text-transform:lowercase}
h2{font-size:clamp(26px,4vw,44px)}
.sub{color:var(--mute)}
.pill{display:inline-block;border:1px solid var(--fg);border-radius:99px;padding:10px 20px;cursor:pointer}
.pill:hover{background:var(--fg);color:var(--bg)}
.empty{padding:80px 0;color:var(--mute);max-width:46ch}

/* ---------- events strip (stories) ---------- */
.strip{display:flex;gap:22px;overflow-x:auto;padding:24px 0 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.story{flex:none;width:84px;text-align:center}
.story .ring{width:84px;height:84px;border-radius:50%;padding:3px;border:2px solid var(--fg)}
.story img{width:100%;height:100%;object-fit:cover;border-radius:50%;filter:grayscale(1)}
.story span{display:block;margin-top:8px;font-size:12px;line-height:1.25}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--pad);margin-top:28px;align-items:end}
.hero-img{aspect-ratio:4/5;max-height:78vh;width:100%;object-fit:cover;filter:grayscale(1);cursor:zoom-in}
.hero-txt h1{font-size:clamp(44px,8vw,120px);margin:10px 0 22px;overflow-wrap:anywhere}
.hero-txt .sub{margin-bottom:26px}

/* ---------- masonry ---------- */
.wall{column-count:4;column-gap:10px}
@media(max-width:1100px){.wall{column-count:3}}
@media(max-width:760px){.wall{column-count:2}}
.ph{position:relative;break-inside:avoid;margin-bottom:10px;background:var(--soft);cursor:zoom-in;overflow:hidden}
.ph img{width:100%;height:auto;filter:grayscale(1);transition:filter .3s,transform .5s}
.ph:hover img{filter:grayscale(0);transform:scale(1.02)}
.ph figcaption{
  position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:center;
  padding:28px 12px 10px;color:#fff;font-size:12px;
  background:linear-gradient(transparent,rgba(0,0,0,.72));
  opacity:0;transition:opacity .2s;
}
.ph:hover figcaption,.ph:focus-within figcaption{opacity:1}
@media(hover:none){.ph figcaption{opacity:1}}
.ph .acts{display:flex;gap:14px;align-items:center}

/* like + download */
.like{display:inline-flex;align-items:center;gap:6px}
.like svg,.dl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.like[aria-pressed="true"] svg{fill:currentColor}
.like .n{font-variant-numeric:tabular-nums}
.dl{display:inline-flex}

/* ---------- albums ---------- */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:48px 28px}
.album{display:block}
.stack{position:relative;aspect-ratio:1;margin:0 10px 10px 0}
.stack i,.stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stack i{background:var(--soft);border:1px solid var(--line);transition:transform .3s}
.stack i:nth-child(1){transform:translate(10px,10px)}
.stack i:nth-child(2){transform:translate(5px,5px)}
.stack img{filter:grayscale(1);transition:filter .3s}
.album:hover .stack i:nth-child(1){transform:translate(14px,14px)}
.album:hover .stack img{filter:grayscale(0)}
.album h3{font-stretch:115%;font-weight:700;font-size:20px;letter-spacing:-.02em;margin-top:18px;text-transform:lowercase}
.album .sub{font-size:13px}

/* ---------- recap ---------- */
.banner{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;background:var(--fg);color:var(--bg);padding:clamp(24px,5vw,60px)}
.banner h2{font-size:clamp(34px,7vw,96px)}
.banner .pill{border-color:var(--bg)}
.banner .pill:hover{background:var(--bg);color:var(--fg)}
.months{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 8px}
.months a{border:1px solid var(--line);border-radius:99px;padding:8px 18px}
.months a.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stats{display:flex;gap:clamp(24px,6vw,80px);margin:36px 0}
.stats b{display:block;font-stretch:125%;font-weight:800;font-size:clamp(36px,6vw,72px);letter-spacing:-.04em;line-height:1}
.top-grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:minmax(160px,22vw);gap:10px}
.top-grid .ph{margin:0}
.top-grid .ph:first-child{grid-row:span 2}
.top-grid .ph img{height:100%;object-fit:cover}
@media(max-width:760px){.top-grid{grid-template-columns:1fr 1fr}.top-grid .ph:first-child{grid-column:span 2}}

/* ---------- viewer ---------- */
dialog{
  border:0;padding:0;margin:0;width:100vw;height:100vh;max-width:none;max-height:none;
  background:#000;color:#fff;
}
dialog[open]{display:grid;grid-template-rows:1fr auto;place-items:center}
dialog::backdrop{background:#000}
#lb-img{max-height:calc(100vh - 110px);max-width:92vw;object-fit:contain}
.x{position:absolute;top:18px;right:22px;z-index:2;border:1px solid #444;border-radius:99px;padding:8px 18px}
.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:54px;line-height:1;padding:14px 18px;color:#bbb}
.nav:hover{color:#fff}
.prev{left:6px}.next{right:6px}
.lb-bar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px var(--pad);border-top:1px solid #222}
.lb-bar strong{display:block;font-stretch:115%;font-weight:700;font-size:18px;text-transform:lowercase}
.lb-bar span{color:#9a9a9a;font-size:13px}
.lb-bar .acts{display:flex;gap:18px;align-items:center}
.lb-bar .pill{border-color:#fff}
.lb-bar .pill:hover{background:#fff;color:#000}

/* ---------- footer + responsive ---------- */
.foot{padding:28px var(--pad);border-top:1px solid var(--line);color:var(--mute);font-size:13px}
@media(max-width:900px){
  .top{grid-template-columns:1fr auto;row-gap:10px}
  .tabs{grid-row:2;grid-column:1/-1}
  .search{grid-row:3;grid-column:1/-1}
  .search input{max-width:none}
  .hero{grid-template-columns:1fr}
  .banner{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- additions: poll, clips, comments ---------- */
h2.small{font-size:24px}
#lb-comment{color:#cfcfcf;font-size:14px;margin-top:6px;max-width:60ch}
.poll{max-width:640px}
.poll h2{font-size:clamp(22px,3vw,32px);margin-bottom:22px}
.opts{display:grid;gap:10px;margin-bottom:12px}
.opt{position:relative;display:flex;justify-content:space-between;align-items:center;text-align:left;
  border:1px solid var(--fg);border-radius:99px;padding:14px 22px;overflow:hidden}
button.opt:hover{background:var(--fg);color:var(--bg)}
.opt.done{border-color:var(--line)}
.opt.done i{position:absolute;inset:0 auto 0 0;background:var(--soft);z-index:0}
.opt.done.mine{border-color:var(--fg)}
.opt.done.mine i{background:var(--fg);opacity:.14}
.opt.done span,.opt.done b{position:relative;z-index:1}

.clips{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.clips::-webkit-scrollbar{display:none}
.clips.wrap{flex-wrap:wrap;overflow:visible}
.clip{position:relative;flex:none;width:clamp(150px,18vw,220px);aspect-ratio:9/16;background:var(--soft);overflow:hidden;text-align:left}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);pointer-events:none}
.clip::before{content:"";position:absolute;left:50%;top:44%;z-index:1;transform:translate(-30%,-50%);
  border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;filter:drop-shadow(0 0 6px #0008)}
.clip::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.75))}
.clip span{position:absolute;left:12px;right:12px;z-index:2;color:#fff}
.clip-title{bottom:30px;font-weight:700;font-stretch:110%;text-transform:lowercase}
.clip-date{bottom:12px;font-size:12px;opacity:.8}
#cv video{max-height:calc(100vh - 100px);max-width:92vw;background:#000}

/* ---------- intro: N, U, full logo, spin, white light, 26-27 ---------- */
body.lock{overflow:hidden}
#intro{position:fixed;inset:0;z-index:100;background:#000;color:#fff;display:grid;place-items:center;transition:opacity .6s;overflow:hidden}
#intro.gone{opacity:0;pointer-events:none}
#skip{position:absolute;top:18px;right:22px;z-index:3;border:1px solid #888;border-radius:99px;padding:8px 18px;color:#fff;mix-blend-mode:difference}
.stage{position:relative;z-index:2;mix-blend-mode:difference}
.spin{perspective:900px}
.mark{position:relative;width:min(62vw,300px);aspect-ratio:1;animation:spin 2.4s 3.1s cubic-bezier(.65,0,.35,1) both}
.pc{position:absolute;display:block;background:#fff;-webkit-mask:var(--m) 0 0/100% 100% no-repeat;mask:var(--m) 0 0/100% 100% no-repeat}

@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes full{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
.fill,.glow,.orbit{position:absolute;z-index:1;pointer-events:none;opacity:0}
.fill{inset:0;background:#fff;animation:fill 1.6s 4.2s ease-in both}
.glow{left:50%;top:50%;width:min(62vw,300px);aspect-ratio:1;margin:calc(min(62vw,300px)/-2) 0 0 calc(min(62vw,300px)/-2);border-radius:50%;box-shadow:0 0 50px 24px rgba(255,255,255,.85),0 0 140px 70px rgba(255,255,255,.45);animation:halo 2s 3.6s ease-in both}
.orbit{left:50%;top:50%;width:min(62vw,300px);aspect-ratio:1;margin:calc(min(62vw,300px)/-2) 0 0 calc(min(62vw,300px)/-2);animation:orbit 2.4s 3.1s cubic-bezier(.65,0,.35,1) both}
.orbit::before{content:"";position:absolute;left:50%;top:-2%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 0 18px 8px #fff,0 0 60px 28px rgba(255,255,255,.55)}
@keyframes halo{0%{opacity:0;transform:scale(1)}25%{opacity:1}100%{opacity:1;transform:scale(30)}}
@keyframes orbit{0%{opacity:0;transform:rotate(0)}12%{opacity:1}85%{opacity:1}100%{opacity:0;transform:rotate(720deg)}}
@keyframes fill{to{opacity:1}}
.yr{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:26px;display:flex;gap:.06em;white-space:nowrap;font:800 clamp(34px,8vw,64px) "Archivo",sans-serif;font-stretch:125%;letter-spacing:-.02em}
.yr span{opacity:0;transform:translateY(14px);animation:yin .5s both}
@keyframes yin{to{opacity:1;transform:none}}

.adm{max-width:980px;margin:0 auto;padding:24px var(--pad) 100px}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.adm-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.adm-tabs button{border:1px solid var(--line);border-radius:99px;padding:8px 20px}
.adm-tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.adm h2{font-size:30px;margin-bottom:18px}
.adm p.hint{color:var(--mute);margin:-8px 0 20px;max-width:64ch}
.box{border:1px solid var(--line);padding:20px;margin-bottom:20px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px;align-items:end}
.adm label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.adm input,.adm textarea,.adm select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:9px 12px;width:100%}
.adm input:focus,.adm textarea:focus{border-color:var(--fg);outline:0}
.adm textarea{min-height:60px;resize:vertical}
.pic{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.pic .thumb{width:72px;height:72px;background:var(--soft);object-fit:cover}
.pic .row{margin:0 0 8px}
.btn{border:1px solid var(--fg);border-radius:99px;padding:9px 20px;display:inline-block;cursor:pointer}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.solid:hover{opacity:.8}
.btn.del{border-color:var(--line);color:var(--mute);padding:6px 14px;font-size:13px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.adm ol{margin:12px 0 0 20px;display:grid;gap:8px;max-width:64ch}
.lock-screen{min-height:100vh;display:grid;place-content:center;gap:16px;text-align:center;justify-items:center}
.lock-screen svg{width:120px;height:120px}
.lock-screen input{border:1px solid var(--line);border-radius:99px;padding:12px 20px;background:var(--bg);color:var(--fg);text-align:center}

body.is-admin .top,body.is-admin .foot,body.is-admin #intro{display:none}
body.is-admin main{padding:0}
</style>
</head>

/* ============================================================

/* ---------- 1. small helpers ---------- */
const $ = (selector, root = document) => root.querySelector(selector);
const view = $("#view");
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const two = (n) => String(n).padStart(2, "0");

function monthKey(d)  { return d.getFullYear() + "-" + two(d.getMonth() + 1); }          // "2026-09"
function monthName(k) { const [y, m] = k.split("-"); return MONTHS[m - 1] + " " + y; }   // "September 2026"
function dayDate(d)   { return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
function dayTime(d)   { return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3) + ", " + two(d.getHours()) + ":" + two(d.getMinutes()); }

/* "today", "3 days ago"... recalculated every time the page opens, so it updates by itself */
function ago(d) {
  const days = Math.floor((Date.now() - d) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 14) return days + " days ago";
  if (days < 60) return Math.floor(days / 7) + " weeks ago";
  return "";
}

/* ---------- 2. load the data ---------- */
let SITE, PHOTOS, ALBUMS, photoById, CLIPS, MONTH_KEYS;
function build(site) {
SITE = site; PHOTOS = [];
ALBUMS = (SITE.albums || []).map((a) => {
  const album = { ...a, dateObj: new Date(a.date + "T09:00") };
  album.photos = (a.photos || []).map((p, i) => {
    const photo = {
      id: a.id + "~" + p.file,
      album: a.id,
      albumTitle: a.title,
      title: p.caption || a.title + " " + (i + 1),
      comment: p.comment || "",
      date: new Date(p.taken || a.date + "T09:00"),
      src: p.url || (a.folder || "") + p.file,
      seed: (i * 7 + a.id.length * 13) % 10,      // only used for the grey placeholder
      baseLikes: 0
    };
    PHOTOS.push(photo);
    return photo;
  });
  album.coverPhoto = a.coverUrl ? { ...album.photos[0], src: a.coverUrl, isCover: true } : album.photos.find((p) => p.src === a.cover) || album.photos[0];
  return album;
}).filter((a) => a.photos.length).sort((a, b) => b.dateObj - a.dateObj);

PHOTOS.sort((a, b) => b.date - a.date);
photoById = Object.fromEntries(PHOTOS.map((p) => [p.id, p]));
CLIPS = (SITE.clips || []).map((c, i) => ({ ...c, id: i, src: c.url || (SITE.clipsFolder || "clips/") + c.file, dateObj: new Date(c.date + "T12:00") }))
  .sort((a, b) => b.dateObj - a.dateObj);
MONTH_KEYS = [...new Set(PHOTOS.map((p) => monthKey(p.date)))].sort().reverse();

build({ albums: [], clips: [] });

function placeholder(seed) {
  const tall = seed % 2 === 0, tone = 22 + seed * 5;
  const h = tall ? 1000 : 640;

}
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName === "IMG" && !img.dataset.fallback) { img.dataset.fallback = 1; img.src = placeholder(+img.dataset.seed || 0); }
}, true);

/* ---------- 3. card templates ---------- */
const downloadIcon = '<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';

function photoImg(p, cls = "") {
  const h = p.seed % 2 === 0 ? 1000 : 640;
  return '<img class="' + cls + '" loading="lazy" src="' + p.src + '" data-seed="' + p.seed + '" alt="' + p.title + '" width="800" height="' + h + '">';
}

function photoCard(p) {
  return '<figure class="ph" data-open="' + p.id + '">' + photoImg(p) +
    '<figcaption><span>' + dayTime(p.date) + '</span><span class="acts">' +
    '<button class="like" data-like="' + p.id + '" type="button"></button>' +
    '<a class="dl" href="' + p.src + '" download aria-label="Download photo">' + downloadIcon + '</a>' +
    '</span></figcaption></figure>';
}
const wall = (list) => '<div class="wall">' + list.map(photoCard).join("") + '</div>';

function albumCard(a) {
  return '<a class="album" href="#/album/' + a.id + '"><div class="stack"><i></i><i></i>' +
    photoImg(a.coverPhoto) + '</div><h3>' + a.title + '</h3><p class="sub">' + dayDate(a.dateObj) + ', ' + a.photos.length + ' photos</p></a>';
}

function clipCard(c) {
  return '<button class="clip" data-clip="' + c.id + '" type="button"><video src="' + c.src + '#t=0.5" preload="metadata" muted playsinline></video>' +
    '<span class="clip-title">' + c.title + '</span><span class="clip-date">' + dayDate(c.dateObj) + '</span></button>';
}

function monthButtons(current) {
  return '<div class="months">' + MONTH_KEYS.map((k) => '<a href="#/recap/' + k + '" class="' + (k === current ? "on" : "") + '">' + monthName(k) + '</a>').join("") + '</div>';
}

/* ---------- 4. likes + poll ---------- */
let liked = new Set();
try { liked = new Set(JSON.parse(localStorage.getItem("ni-liked") || "[]")); } catch (e) {}

/* shared like counts live in Supabase (table "likes"). If it can't be reached, likes fall back to this browser only. */
const SB_URL = "https://gsbwxaejjrbjrapihdbu.supabase.co";
const SB_KEY = "sb_publishable_9wiNfto8Pi4VwtrCEP_cFQ_xzHmUVdX";
const sbHead = { apikey: SB_KEY, "Content-Type": "application/json" };
let shared = null;   /* photo id -> count for everyone; null until loaded */

function likeCount(p) { return shared ? (shared[p.id] || 0) : p.baseLikes + (liked.has(p.id) ? 1 : 0); }
const repaintLikes = () => document.querySelectorAll("[data-like]").forEach((b) => { if (photoById[b.dataset.like]) paintLike(b); });

async function loadShared() {
  try {
    const r = await fetch(SB_URL + "/rest/v1/likes?select=photo_id,n", { headers: sbHead });
    if (!r.ok) return;
    const next = {};
    (await r.json()).forEach((x) => { next[x.photo_id] = x.n; });
    const changed = JSON.stringify(next) !== JSON.stringify(shared);
    shared = next;
    if (changed) { repaintLikes(); if (location.hash.startsWith("#/recap")) render(); }
  } catch (e) { /* stay on browser-only likes */ }
}

function toggleLike(id) {
  const delta = liked.has(id) ? -1 : 1;
  if (delta === 1) liked.add(id); else liked.delete(id);
  try { localStorage.setItem("ni-liked", JSON.stringify([...liked])); } catch (e) {}
  if (shared) shared[id] = Math.max(0, (shared[id] || 0) + delta);
  repaintLikes();
  fetch(SB_URL + "/rest/v1/rpc/bump_like", { method: "POST", headers: sbHead, body: JSON.stringify({ pid: id, delta }) })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((n) => { if (shared) { shared[id] = n; repaintLikes(); } })
    .catch(() => {});
}

function paintLike(btn) {
  const p = photoById[btn.dataset.like];
  btn.setAttribute("aria-pressed", liked.has(p.id));
  btn.setAttribute("aria-label", (liked.has(p.id) ? "Unlike. " : "Like. ") + likeCount(p) + " likes");
  btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11z"/></svg><span class="n">' + likeCount(p) + '</span>';
}

/* The poll remembers each visitor's choice in their own browser.
   (To count votes across everyone you need a server - see the notes.) */
const pollKey = () => "ni-vote-" + SITE.poll.question;
function myVote() { try { return localStorage.getItem(pollKey()); } catch (e) { return null; } }

function pollBlock() {
  const poll = SITE.poll;
  if (!poll || !poll.options.length) return "";
  const mine = myVote();
  const votes = poll.options.map((o, i) => o.votes + (mine === String(i) ? 1 : 0));
  const total = votes.reduce((a, b) => a + b, 0) || 1;
  const rows = poll.options.map((o, i) => {
    const pct = Math.round(votes[i] / total * 100);
    if (mine === null) return '<button class="opt" data-vote="' + i + '" type="button">' + o.text + '</button>';
    return '<div class="opt done' + (mine === String(i) ? " mine" : "") + '"><i style="width:' + pct + '%"></i><span>' + o.text + '</span><b>' + pct + '%</b></div>';
  }).join("");
  return '<section class="sec poll"><h2>' + poll.question + '</h2><div class="opts">' + rows + '</div>' +
    '<p class="sub">' + (mine === null ? "Tap one to vote and see the results." : total + " votes so far.") + '</p></section>';
}

/* ---------- 5. pages ---------- */
function homePage() {
  const latest = ALBUMS[0], lead = latest.coverPhoto;
  const when = ago(latest.dateObj);
  const thisMonth = monthKey(new Date());
  const recapKey = MONTH_KEYS.includes(thisMonth) ? thisMonth : MONTH_KEYS[0];   // current month updates by itself
  return '<div class="strip">' + ALBUMS.map((a) =>
      '<a class="story" href="#/album/' + a.id + '"><div class="ring">' + photoImg(a.coverPhoto) + '</div><span>' + a.title + '</span></a>').join("") + '</div>' +
    '<section class="hero">' + photoImg(lead, "hero-img").replace("<img ", lead.isCover ? '<img data-album="' + latest.id + '" ' : '<img data-open="' + lead.id + '" ') +
      '<div class="hero-txt"><p class="sub">Latest event, ' + dayDate(latest.dateObj) + (when ? " (" + when + ")" : "") + '</p>' +
      '<h1>' + latest.title + '</h1><p class="sub">' + latest.photos.length + ' photos</p>' +
      '<a class="pill" href="#/album/' + latest.id + '">Open album</a></div></section>' +
    '<section class="sec"><div class="sec-head"><h2>Just Added</h2><a class="sub" href="#/albums">All albums</a></div>' + wall(PHOTOS.slice(0, 12)) + '</section>' +
    (CLIPS.length ? '<section class="sec"><div class="sec-head"><h2>clips</h2><a class="sub" href="#/clips">All clips</a></div><div class="clips">' + CLIPS.slice(0, 8).map(clipCard).join("") + '</div></section>' : "") +
    pollBlock() +
    '<section class="sec"><div class="banner"><div><p>Month recap</p><h2>' + monthName(recapKey).toLowerCase() + '</h2></div><a class="pill" href="#/recap/' + recapKey + '">See the recap</a></div></section>';
}

function albumsPage() {
  return '<section class="sec"><div class="sec-head"><h2>albums</h2><span class="sub">' + ALBUMS.length + ' events</span></div><div class="albums">' + ALBUMS.map(albumCard).join("") + '</div></section>';
}

function albumPage(id) {
  const a = ALBUMS.find((x) => x.id === id);
  if (!a) return '<p class="empty">That album does not exist. Try the <a href="#/albums"><u>album list</u></a>.</p>';
  return '<section class="sec"><div class="sec-head"><div><h2>' + a.title + '</h2><p class="sub" style="margin-top:10px">' + dayDate(a.dateObj) + ', ' + a.photos.length + ' photos</p></div><a class="sub" href="#/albums">Back to albums</a></div>' + wall(a.photos) + '</section>';
}

function clipsPage() {
  if (!CLIPS.length) return '<p class="empty">No clips yet.</p>';
  return '<section class="sec"><div class="sec-head"><h2>clips</h2></div><div class="clips wrap">' + CLIPS.map(clipCard).join("") + '</div></section>';
}

function recapPage(key) {
  key = key || MONTH_KEYS.find((k) => k === monthKey(new Date())) || MONTH_KEYS[0];
  const list = PHOTOS.filter((p) => monthKey(p.date) === key);
  if (!list.length) return '<section class="sec"><h2>recaps</h2>' + monthButtons("") + '<p class="empty">Nothing was photographed in that month.</p></section>';
  const top = [...list].sort((a, b) => likeCount(b) - likeCount(a)).slice(0, 5);
  const events = new Set(list.map((p) => p.album)).size;
  const likes = list.reduce((sum, p) => sum + likeCount(p), 0);
  const monthWord = MONTHS[+key.split("-")[1] - 1].toLowerCase();
  return '<section class="sec"><div class="sec-head"><h2>' + monthName(key).toLowerCase() + ' recap</h2></div>' + monthButtons(key) +
    '<div class="stats"><div><b>' + list.length + '</b>photos</div><div><b>' + events + '</b>events</div><div><b>' + likes + '</b>likes</div></div>' +
    '<div class="sec-head"><h2 class="small">most liked</h2></div><div class="top-grid">' + top.map(photoCard).join("") + '</div></section>' +
    '<section class="sec"><div class="sec-head"><h2 class="small">everything from ' + monthWord + '</h2></div>' + wall(list) + '</section>';
}

function searchPage(text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  const matches = (str) => words.every((w) => str.toLowerCase().includes(w));
  const photos = PHOTOS.filter((p) => matches([p.title, p.albumTitle, p.comment, MONTHS[p.date.getMonth()], p.date.getFullYear(), DAYS[p.date.getDay()]].join(" ")));
  const albums = ALBUMS.filter((a) => matches(a.title + " " + MONTHS[a.dateObj.getMonth()] + " " + a.dateObj.getFullYear()));
  if (!photos.length) return '<p class="empty">No photos match that. Try an event name like "science" or a month like "september".</p>';
  return '<section class="sec"><div class="sec-head"><h2>' + photos.length + ' results</h2></div>' +
    (albums.length ? '<div class="albums" style="margin-bottom:56px">' + albums.map(albumCard).join("") + '</div>' : "") + wall(photos) + '</section>';
}

/* chooses the page from the web address (#/albums, #/recap/2026-09 ...) */
function render() {
  const text = $("#q").value.trim();
  document.body.classList.remove("is-admin");
  const parts = location.hash.split("/");
  const route = parts[1] || "home", arg = parts[2];
  let html, active = route;
  if (!ALBUMS.length) html = '<p class="empty">No photos yet. New albums will appear here as soon as they are published.</p>';
  else if (text)               { html = searchPage(text); active = ""; }
  else if (route === "albums") html = albumsPage();
  else if (route === "album")  { html = albumPage(arg); active = "albums"; }
  else if (route === "clips")  html = clipsPage();
  else if (route === "recap")  html = recapPage(arg);
  else                         { html = homePage(); active = "home"; }
  view.innerHTML = html;
  view.querySelectorAll("[data-like]").forEach(paintLike);
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === active));
}
window.addEventListener("hashchange", () => { $("#q").value = ""; render(); window.scrollTo(0, 0); });
$("#q").addEventListener("input", render);

/* ---------- 6. viewers, clicks, intro ---------- */
const photoBox = $("#lb"), clipBox = $("#cv");
let shown = [], position = 0;

function openPhoto(id) {
  shown = [...new Set([...view.querySelectorAll("[data-open]")].map((el) => el.dataset.open))];   // photos on this page
  position = Math.max(0, shown.indexOf(id));
  showPhoto();
  if (!photoBox.open) photoBox.showModal();
}
function showPhoto() {
  const p = photoById[shown[position]];
  $("#lb-img").src = p.src; $("#lb-img").dataset.seed = p.seed; delete $("#lb-img").dataset.fallback; $("#lb-img").alt = p.title;
  $("#lb-title").textContent = p.title;
  $("#lb-meta").textContent = dayTime(p.date) + " - " + p.albumTitle;
  $("#lb-comment").textContent = p.comment;
  $("#lb-dl").href = p.src;
  const like = $("#lb-like"); like.dataset.like = p.id; paintLike(like);
}
function step(by) { position = (position + by + shown.length) % shown.length; showPhoto(); }
$("#lb-prev").onclick = () => step(-1);
$("#lb-next").onclick = () => step(1);
$("#lb-close").onclick = () => photoBox.close();
photoBox.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });

function openClip(id) {
  const c = CLIPS.find((x) => x.id === id);
  $("#cv-video").src = c.src;
  $("#cv-title").textContent = c.title;
  $("#cv-meta").textContent = dayDate(c.dateObj);
  $("#cv-dl").href = c.src;
  clipBox.showModal();
  $("#cv-video").play().catch(() => {});
}
$("#cv-close").onclick = () => clipBox.close();
clipBox.addEventListener("close", () => { $("#cv-video").pause(); });

document.addEventListener("click", (e) => {
  const toAlbum = e.target.closest("[data-album]");
  if (toAlbum) { location.hash = "#/album/" + toAlbum.dataset.album; return; }
  const likeBtn = e.target.closest("[data-like]");
  if (likeBtn) { e.preventDefault(); toggleLike(likeBtn.dataset.like); return; }

  const voteBtn = e.target.closest("[data-vote]");
  if (voteBtn) { try { localStorage.setItem(pollKey(), voteBtn.dataset.vote); } catch (err) {} render(); return; }

  const clipBtn = e.target.closest("[data-clip]");
  if (clipBtn) { openClip(+clipBtn.dataset.clip); return; }

  if (e.target.closest(".dl, #lb-dl, #cv-dl")) return;
  const photo = e.target.closest("[data-open]");
  if (photo && view.contains(photo)) openPhoto(photo.dataset.open);
});

/* invert: white page <-> black page */
const root = document.documentElement;
try { if (localStorage.getItem("ni-theme") === "dark") root.dataset.theme = "dark"; } catch (e) {}
$("#invert").onclick = () => {
  const dark = root.dataset.theme !== "dark";
  root.dataset.theme = dark ? "dark" : "light";
  try { localStorage.setItem("ni-theme", dark ? "dark" : "light"); } catch (e) {}
};

/* intro: the 6-7 arms, then the logo, then the site (CSS does the animation) */
const intro = $("#intro");
function endIntro() { intro.classList.add("gone"); setTimeout(() => intro.remove(), 700); }
if (location.hash === "#admin" || matchMedia("(prefers-reduced-motion: reduce)").matches) intro.remove();
else { document.body.classList.add("lock"); setTimeout(() => { endIntro(); document.body.classList.remove("lock"); }, 9200); }
if ($("#skip")) $("#skip").onclick = () => { endIntro(); document.body.classList.remove("lock"); };

/* ---------- live data: feed.json is written by studio.html ---------- */
let lastRaw = null;
async function load() {
  try {
    const r = await fetch("feed.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const raw = await r.text();
    if (raw !== lastRaw) { lastRaw = raw; build(JSON.parse(raw)); render(); }
  } catch (e) {
    /* feed.json can't be read (for example when this file is opened straight from a computer): show the built-in copy */
    if (lastRaw === null) { lastRaw = "built-in"; build(JSON.parse(document.getElementById("state").textContent)); render(); }
  }
}
render();
load();
loadShared();
setInterval(load, 20000);
setInterval(loadShared, 30000);

</script></body></html>
